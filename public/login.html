<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Local Classifieds Board</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="auth-box card">
    <h1>Login</h1>
    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required>
        <button class="btn" type="submit">Login</button>
        <div class="error-msg" id="msg"></div>
    </form>
    <p style="margin-top:15px;">Don't have an account? <a href="/register.html">Sign up here</a></p>
</div>

<script src="/js/app.js"></script>
<script>
renderNavbar('nav');

// If already logged in, go straight to board
if (getToken()) window.location.href = '/index.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.textContent = '';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
            msg.textContent = data.error || 'Login failed.';
            return;
        }
        setAuth(data.token, data.user);
        window.location.href = '/index.html';
    } catch (err) {
        msg.textContent = 'Could not connect to server.';
    }
});
</script>
</body>
</html>
